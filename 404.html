<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません — Transformix</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;700;800&display=swap&font-display=swap" rel="stylesheet" crossorigin="anonymous">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --indigo: #1e3a5f; --muted: #222; --border: #e0e0e0; --bg: #faf9f7; }
    body { font-family: 'M PLUS 2','Helvetica Neue','Hiragino Sans','Yu Gothic',sans-serif; background: var(--bg); color: var(--indigo); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .inner { max-width: 480px; }
    .code { font-size: 5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-bottom: 1.5rem; opacity: 0.12; }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 1rem; color: var(--indigo); }
    p { font-size: 0.95rem; color: var(--muted); line-height: 1.8; margin-bottom: 2rem; }
    a.btn { display: inline-block; background: var(--indigo); color: #fff; padding: 0.85rem 2.2rem; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.04em; text-decoration: none; transition: opacity 0.2s; }
    a.btn:hover { opacity: 0.75; }
    .sub { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
    .sub a { color: var(--indigo); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="inner">
    <div class="code">404</div>
    <h1>ページが見つかりません。</h1>
    <p>お探しのページは移動・削除されたか、URLが間違っている可能性があります。</p>
    <a href="/" class="btn">トップへ戻る</a>
    <p class="sub">または <a href="#contact" onclick="location.href='/#contact'">お問い合わせ</a> からご連絡ください。</p>
  </div>
</body>
</html>
