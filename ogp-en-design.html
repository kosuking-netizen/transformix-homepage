<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'M PLUS 2', Arial, sans-serif;
      background: #1e3a5f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .bg-circle { position: absolute; border-radius: 50%; opacity: 0.06; background: #fff; }
    .bg-circle-1 { width: 600px; height: 600px; right: -150px; top: -150px; }
    .bg-circle-2 { width: 300px; height: 300px; left: -80px; bottom: -80px; }
    .bg-line { position: absolute; background: rgba(255,255,255,0.06); height: 1px; width: 100%; left: 0; }
    .bg-line-1 { top: 210px; }
    .bg-line-2 { top: 420px; }
    .inner { position: relative; z-index: 1; padding: 0 100px; width: 100%; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 28px; }
    h1 { font-size: 60px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 28px; }
    .sub { font-size: 20px; color: rgba(255,255,255,0.65); line-height: 1.6; font-weight: 400; margin-bottom: 48px; }
    .logo-area { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 20px; font-weight: 800; letter-spacing: 0.01em; color: #fff; }
    .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.3); }
    .tagline { font-size: 14px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; }
    .deco { position: absolute; right: 100px; top: 50%; transform: translateY(-50%); text-align: right; z-index: 1; }
    .deco-text { font-size: 160px; font-weight: 800; color: rgba(255,255,255,0.04); letter-spacing: -0.05em; line-height: 1; }
  </style>
</head>
<body>
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-line bg-line-1"></div>
  <div class="bg-line bg-line-2"></div>
  <div class="inner">
    <div class="eyebrow">Management Transformation Partner · Kyoto, Japan</div>
    <h1>Business transformation<br>compounds.</h1>
    <div class="sub">SCM × Digital × Organization<br>Reconnecting the flow through a clear management axis.</div>
    <div class="logo-area">
      <span class="logo">Transformix</span>
      <div class="divider"></div>
      <span class="tagline">transformix.jp/en</span>
    </div>
  </div>
  <div class="deco">
    <div class="deco-text">T</div>
  </div>
</body>
</html>
