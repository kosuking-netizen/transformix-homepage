<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://transformix.jp/thanks.html">
  <title>送信完了 — Transformix</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --border: #e0e0e0; --indigo: #1e3a5f; --muted: #222; --text: #111; }
    body { font-family: 'M PLUS 2','Helvetica Neue','Hiragino Sans','Yu Gothic',sans-serif; color: var(--text); background: #faf9f7; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--border); }
    nav { max-width:1100px; margin:0 auto; padding:0 2.5rem; height:68px; display:flex; align-items:center; }
    .logo { font-size:1.25rem; font-weight:800; letter-spacing:0.06em; text-decoration:none; color:var(--text); }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:4rem 2.5rem; text-align:center; }
    .box { max-width:480px; }
    .icon { font-size:3rem; margin-bottom:1.5rem; }
    h1 { font-size:1.75rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:1rem; color:var(--indigo); }
    p { font-size:0.95rem; color:var(--muted); line-height:1.9; margin-bottom:2rem; }
    .btn { display:inline-block; background:var(--indigo); color:#fff; padding:0.9rem 2.2rem; font-size:0.9rem; font-weight:600; letter-spacing:0.04em; text-decoration:none; transition:opacity 0.2s; }
    .btn:hover { opacity:0.75; }
    footer { background:var(--text); color:rgba(255,255,255,0.35); text-align:center; padding:2.5rem; font-size:0.8rem; }
  </style>
</head>
<body>
  <header>
    <nav><a href="/" class="logo">Transformix</a></nav>
  </header>
  <main>
    <div class="box">
      <div class="icon">✉️</div>
      <h1>送信が完了しました</h1>
      <p>お問い合わせいただきありがとうございます。<br>内容を確認のうえ、2営業日以内にご返信いたします。</p>
      <a href="/" class="btn">トップページへ戻る</a>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Transformix. All rights reserved.</p>
  </footer>
</body>
